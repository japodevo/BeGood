name: Refresh RainCheck deals

on:
  schedule:
    - cron: "0 14 * * *" # 7:00 AM Pacific, daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: raincheck-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices, scores, pages and alerts
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/refresh-deals.mjs

      - name: Commit updated data
        run: |
          git config user.name "raincheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: daily price refresh $(date -u +%F)"
          git push

      - name: Alert ops topic on failure
        if: failure()
        run: |
          TOPIC=$(node -p "require('./deals/config.json').ntfy.opsTopic||''")
          if [ -n "$TOPIC" ]; then
            curl -s -X POST "https://ntfy.sh/$TOPIC" \
              -H "Title: RainCheck refresh FAILED" -H "Priority: high" \
              -d "Daily refresh failed — site data will go stale. Check the Actions tab: https://github.com/${{ github.repository }}/actions"
          fi
