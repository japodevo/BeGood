name: Refresh RainCheck deals

on:
  schedule:
    - cron: "0 14 * * *" # 7:00 AM Pacific, daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Refresh prices, scores, pages and alerts
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}
        run: node scripts/refresh-deals.mjs

      - name: Commit updated data
        run: |
          git config user.name "raincheck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add deals
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "data: daily price refresh $(date -u +%F)"
          git push
